name: HELIOS integration pack

on:
  pull_request:
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'src/HELIOS.HardwareDetection/**'
      - 'src/HELIOS.SoftwareCatalog/**'
      - 'tests/HELIOS.IntegrationPack.Tests/**'
      - 'infra/bicep/**'
      - '.github/workflows/helios-integration-pack.yml'
  workflow_dispatch:
    inputs:
      run_azure_what_if:
        description: Run Azure OIDC what-if validation
        required: true
        default: false
        type: boolean
      environment_name:
        description: Validation environment
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read

jobs:
  manifests-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run manifest unit tests
        run: python -m unittest discover -s tests/HELIOS.IntegrationPack.Tests -p 'test_*.py' -v
      - name: Build .NET integration projects
        run: |
          dotnet build src/HELIOS.HardwareDetection/HELIOS.HardwareDetection.csproj --configuration Release
          dotnet build src/HELIOS.SoftwareCatalog/HELIOS.SoftwareCatalog.csproj --configuration Release

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

  bicep-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/bicep/main.bicep

  azure-oidc-what-if:
    if: github.event_name == 'workflow_dispatch' && inputs.run_azure_what_if
    runs-on: ubuntu-latest
    environment: azure-what-if
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resource-group what-if only
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        with:
          inlineScript: |
            test -n "$RESOURCE_GROUP"
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra/bicep/main.bicep \
              --parameters environmentName="$ENVIRONMENT_NAME" \
              --no-pretty-print
