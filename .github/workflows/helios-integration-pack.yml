name: HELIOS integration pack

on:
  pull_request:
    paths:
      - 'integration/apps-drivers/**'
      - 'tests/HELIOS.IntegrationPack.Tests/**'
      - 'infra/bicep/**'
      - '.github/workflows/helios-integration-pack.yml'
  push:
    branches:
      - agent/integration-apps-drivers
    paths:
      - 'integration/apps-drivers/**'
      - 'tests/HELIOS.IntegrationPack.Tests/**'
      - 'infra/bicep/**'
      - '.github/workflows/helios-integration-pack.yml'
  workflow_dispatch:
    inputs:
      run_azure_what_if:
        description: Run Azure OIDC what-if validation
        required: true
        default: false
        type: boolean
      environment_name:
        description: Validation environment
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read

env:
  PACK_ARCHIVE: integration/apps-drivers/helios_integration_apps_drivers_pack.zip
  PACK_ROOT: integration/apps-drivers/extracted/helios_integration_apps_drivers_pack
  EXPECTED_FILE_COUNT: '37'

jobs:
  manifests-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover repository archive hash
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk 'NR==1 {print tolower($1)}' integration/apps-drivers/SHA256SUMS)"
          actual="$(sha256sum "$PACK_ARCHIVE" | awk '{print tolower($1)}')"
          size="$(stat -c '%s' "$PACK_ARCHIVE")"
          printf 'expected_sha256=%s\nactual_sha256=%s\narchive_size=%s\n' "$expected" "$actual" "$size" | tee archive-integrity.txt
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "actual=$actual" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-integrity-diagnostic
          path: archive-integrity.txt
          if-no-files-found: error
          retention-days: 7
      - name: Validate ZIP structure
        run: unzip -t "$PACK_ARCHIVE"
      - name: Validate ZIP file count
        shell: bash
        run: |
          set -euo pipefail
          count="$(unzip -Z1 "$PACK_ARCHIVE" | grep -v '/$' | wc -l | tr -d ' ')"
          echo "archive_file_count=$count"
          test "$count" = "$EXPECTED_FILE_COUNT"
      - name: Extract integration pack
        run: unzip -q "$PACK_ARCHIVE" -d integration/apps-drivers/extracted
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run manifest unit tests
        env:
          HELIOS_PACK_ROOT: ${{ github.workspace }}/${{ env.PACK_ROOT }}
        run: python -m unittest discover -s tests/HELIOS.IntegrationPack.Tests -p 'test_*.py' -v
      - name: Build .NET integration projects
        run: |
          dotnet build "$PACK_ROOT/src/HELIOS.HardwareDetection/HELIOS.HardwareDetection.csproj" --configuration Release
          dotnet build "$PACK_ROOT/src/HELIOS.SoftwareCatalog/HELIOS.SoftwareCatalog.csproj" --configuration Release
      - name: Enforce repository checksum lock
        shell: bash
        run: test '${{ steps.archive.outputs.actual }}' = '${{ steps.archive.outputs.expected }}'

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover Windows archive hash
        id: archive
        shell: pwsh
        run: |
          $expected = ((Get-Content 'integration/apps-drivers/SHA256SUMS' | Select-Object -First 1) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $env:PACK_ARCHIVE).Hash.ToLowerInvariant()
          $size = (Get-Item $env:PACK_ARCHIVE).Length
          Write-Host "expected_sha256=$expected"
          Write-Host "actual_sha256=$actual"
          Write-Host "archive_size=$size"
          "expected=$expected" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "actual=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Extract integration pack
        shell: pwsh
        run: Expand-Archive -Path $env:PACK_ARCHIVE -DestinationPath 'integration/apps-drivers/extracted' -Force
      - name: Validate extracted file count
        shell: pwsh
        run: |
          $count = (Get-ChildItem $env:PACK_ROOT -File -Recurse).Count
          Write-Host "archive_file_count=$count"
          if ($count -ne [int]$env:EXPECTED_FILE_COUNT) { throw "Expected $env:EXPECTED_FILE_COUNT files, got $count" }
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem "$env:PACK_ROOT/scripts" -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Enforce repository checksum lock
        shell: pwsh
        run: |
          if ('${{ steps.archive.outputs.actual }}' -ne '${{ steps.archive.outputs.expected }}') { throw 'SHA256SUMS does not match repository archive bytes.' }

  bicep-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/bicep/main.bicep

  copilot-automation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Copilot and subagent automation contract
        shell: bash
        run: |
          set -euo pipefail
          test -f integration/apps-drivers/SHA256SUMS
          test -f .github/workflows/helios-integration-pack.yml
          grep -q 'azure-oidc-what-if' .github/workflows/helios-integration-pack.yml
          grep -q 'powershell-parse' .github/workflows/helios-integration-pack.yml
          grep -q 'manifests-and-unit-tests' .github/workflows/helios-integration-pack.yml
          echo 'Copilot/subagent contract validated: diagnose -> test -> review -> promote.'

  azure-oidc-what-if:
    if: github.event_name == 'workflow_dispatch' && inputs.run_azure_what_if
    runs-on: ubuntu-latest
    environment: azure-what-if
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resource-group what-if only
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        with:
          inlineScript: |
            test -n "$RESOURCE_GROUP"
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra/bicep/main.bicep \
              --parameters environmentName="$ENVIRONMENT_NAME" \
              --no-pretty-print
